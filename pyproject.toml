[project]
name = "sparse-auto-encoder"
version = "0.1.0"
description = "A project using PyTorch, NumPy, and Pandas"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Nik", email = "81419030+Nikolay-Ts@users.noreply.github.com"},
    {name = "Bilal", email = "157110822+Bilal-Waraich@users.noreply.github.com"}
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "safetensors>=0.7.0",
    "Pillow",
    "albumentations>=2.0.0",
    "mmdet>=3.3.0",
    "MedicalMultitaskModeling @ file://./UmedPT",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"