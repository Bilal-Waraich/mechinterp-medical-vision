[project]
name = "sparse-auto-encoder"
version = "0.1.0"
description = "A project using PyTorch, NumPy, and Pandas"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Nik", email = "81419030+Nikolay-Ts@users.noreply.github.com"},
    {name = "Bilal", email = "157110822+Bilal-Waraich@users.noreply.github.com"}
]

dependencies = [
    # --- Core (our project) ---
    "torch>=2.1.2,<3",
    "numpy>=1.24.0",
    "pandas>=2.1.1,<3",
    "safetensors>=0.7.0",
    "Pillow",
    "matplotlib>=3.7.0",
    # --- UmedPT (mmm) dependencies ---
    "torchvision",
    "scikit-learn>=1.3.1,<2",
    "tqdm>=4.66.1,<5",
    "imageio>=2.31.5,<3",
    "monai>=1.3.0,<2",
    "deepdiff>=6.6.1,<7",
    "torchinfo>=1.8.0,<2",
    "json5>=0.9.14,<0.10",
    "minio>=7.1.17,<8",
    "einops>=0.8.0,<0.9",
    "timm>=1.0.15,<2",
    "nibabel>=5.2.1,<6",
    "typer>=0.9.0",
    "toml>=0.10.2,<0.11",
    "segmentation-models-pytorch>=0.5.0,<0.6",
    "wandb>=0.23.0",
    "albumentations>=2.0.0",
    "logfire[fastapi,celery]>=4.13.2",
    "redis",
    # --- UmedPT-sdk (m3_sdk) dependencies ---
    "pydantic>=2.4.2,<3",
    "pydantic-settings>=2.0.3,<3",
    "scikit-image>=0.25.2,<0.26",
    "tiffslide>=2.5.0,<3",
    "rasterio>=1.3.9,<2",
    "shapely>=2.0.2,<3",
    "msgpack>=1.1.0,<2",
    "fsspec[s3]>=2024.3.1,<2025",
    "universal-pathlib>=0.2.2,<0.3",
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"