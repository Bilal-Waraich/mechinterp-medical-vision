[project]
name = "sparse-auto-encoder"
version = "0.2.0"
description = "BatchTopK Sparse Autoencoder for UMedPT vision model activations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Nik", email = "81419030+Nikolay-Ts@users.noreply.github.com"},
    {name = "Bilal", email = "157110822+Bilal-Waraich@users.noreply.github.com"}
]

dependencies = [
    # ── Core ML ──────────────────────────────────────────────────────────
    "torch>=2.1.2,<3",
    "torchvision",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",

    # ── SAE training (BatchTopK reference: bartbussmann/BatchTopK) ───────
    "sae-lens>=3.0.0",
    "wandb>=0.17.0",

    # ── Activation harvesting ─────────────────────────────────────────────
    "Pillow",
    "scikit-image>=0.25.2,<0.26",
    "opencv-python-headless",
    "tqdm>=4.66.1,<5",

    # ── Data / analysis ───────────────────────────────────────────────────
    "pandas>=2.1.1,<3",
    "matplotlib>=3.7.0",
    "networkx>=3.3",
    "scipy>=1.11.0",          # Pearson p-values for spatial grounding
    "scikit-learn>=1.3.0",    # Logistic-regression probes (scanner + cross-dataset)

    # ── Build utilities ───────────────────────────────────────────────────
    "packaging>=21.0",
    "logfire",
    "segmentation-models-pytorch",     
    "monai",     
    "torchinfo",     
    "shapely",     
    "rasterio",     
    "tiffslide",     
    "universal-pathlib",     
    "pydantic-settings",
    "albumentations",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
